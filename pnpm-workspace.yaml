packages:
  - apps/*
  - packages/*

allowBuilds:
  bufferutil: false
  electron: true
  electron-winstaller: false
  esbuild: true
  msgpackr-extract: false
  msw: false
  utf-8-validate: false

catalog:
  "@effect/openapi-generator": 4.0.0-beta.103
  "@effect/platform-node": 4.0.0-beta.103
  "@effect/tsgo": 0.13.2
  "@effect/vitest": 4.0.0-beta.103
  "@types/node": 24.12.4
  "@typescript/native-preview": 7.0.0-dev.20260604.1
  effect: 4.0.0-beta.103
  vite: npm:@voidzero-dev/vite-plus-core@0.2.2
  vite-plus: 0.2.2

minimumReleaseAgeExclude:
  - "@effect/openapi-generator@4.0.0-beta.103"
  - "@effect/platform-node@4.0.0-beta.103"
  - "@effect/vitest@4.0.0-beta.103"
  - effect@4.0.0-beta.103

overrides:
  "@effect/platform-node": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/vitest>vitest": "-"
  "@types/node": "catalog:"
  effect: "catalog:"
  vite: "catalog:"

packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"
    peerDependenciesMeta:
      vitest:
        optional: true
  vite-plus@*:
    dependencies:
      vite: "catalog:"

patchedDependencies:
  "@effect/vitest@4.0.0-beta.103": patches/@effect__vitest@4.0.0-beta.103.patch
  "effect@4.0.0-beta.103": patches/effect@4.0.0-beta.103.patch

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

supportedArchitectures:
  cpu: [current, x64]
  libc: [current, glibc]
  os: [current, linux]
