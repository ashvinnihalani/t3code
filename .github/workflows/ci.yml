name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify desktop and app-server boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - name: Format
        run: vp fmt --check
      - name: Lint
        run: vp lint --report-unused-disable-directives
      - name: Typecheck
        run: vp run typecheck
      - name: Test
        run: vp run test
      - name: Build desktop
        run: vp run build:desktop
